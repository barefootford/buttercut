# Large binary test fixtures that live OUTSIDE git.
#
# spec/assets/ is gitignored (these clips total ~760 MB). The :fixtures and
# :benchmark specs resolve each clip through spec/support/fixtures.rb, which:
#   1. uses a local copy at spec/assets/<name> if present (size match), otherwise
#   2. downloads it from "<base_url>/<name>", verifies the sha256 below, and
#      caches it into spec/assets/ for next time.
#
# The public bucket URL is NOT hardcoded here — it's supplied at runtime via the
# BUTTERCUT_FIXTURES_BASE_URL env var. CI sets it from the repo Actions variable of
# the same name; locally, export it (or just keep the clips in spec/assets/). The
# ${...} reference below is expanded by spec/support/fixtures.rb. This keeps the
# manifest identical across the open-source repo and forks (each points its own
# bucket via the env var) and avoids publishing the bucket URL in source.
base_url: "${BUTTERCUT_FIXTURES_BASE_URL}"

