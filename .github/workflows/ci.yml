name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macOS is ButterCut's primary platform: the suite's Apple Archive (`aa`)
    # examples only run there. One job runs the default suite and the :fixtures
    # specs so setup (checkout, Ruby, ffmpeg) happens once; :benchmark stays out
    # (wall-time baselines tuned to dev hardware). Windows: test-windows below.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.6'   # matches .ruby-version / .mise.toml
          bundler-cache: true     # bundle install + cache gems from Gemfile.lock

      - name: Install ffmpeg-full (provides the drawtext filter + ffprobe)
        # The contact-sheet builder burns timestamps onto each tile with ffmpeg's
        # `drawtext` filter, which since ffmpeg 6.1 needs libfreetype + libharfbuzz
        # at build time. Homebrew's regular `ffmpeg` formula is built WITHOUT them,
        # so it has no drawtext filter; the `ffmpeg-full` formula bundles
        # fontconfig + freetype + harfbuzz (bottled, no source build) and still
        # provides the ffprobe the metadata specs need. Remove the runner's stock
        # ffmpeg first to avoid a link conflict, then hard-fail if drawtext is
        # somehow still absent rather than surfacing it deep in a spec.
        run: |
          brew uninstall --ignore-dependencies --force ffmpeg || true
          brew install ffmpeg-full
          echo "Using $(command -v ffmpeg)"; ffmpeg -hide_banner -version | head -1
          ffmpeg -hide_banner -filters | grep -q ' drawtext ' \
            || { echo "::error::ffmpeg-full has no drawtext filter (need libfreetype+libharfbuzz)"; exit 1; }

      - name: Cache fixture clips
        # The :fixtures specs run real ffmpeg over large codec clips kept outside git
        # (see spec/assets_manifest.yml). Restored/saved across runs; the helper only
        # downloads on a cache miss (~140 MB), which happens only when the manifest
        # (and thus the key) changes.
        uses: actions/cache@v5
        with:
          path: spec/assets
          key: fixtures-${{ hashFiles('spec/assets_manifest.yml') }}

      - name: Run specs
        env:
          # Public R2 bucket URL for the :fixtures clips, injected from the repo
          # Actions variable so it isn't committed to source. Set it once with:
          #   gh variable set BUTTERCUT_FIXTURES_BASE_URL --body "https://pub-XXXX.r2.dev"
          BUTTERCUT_FIXTURES_BASE_URL: ${{ vars.BUTTERCUT_FIXTURES_BASE_URL }}
        # First the default suite (auto-excludes :fixtures and :benchmark), then the
        # :fixtures specs on their own.
        run: |
          bundle exec rspec
          bundle exec rspec --tag fixtures

  test-windows:
    # Exercises the Windows paths (.exe resolution, argv subprocesses, zip
    # fallbacks) on a real runner; default suite only. Informational for now:
    # a few specs still assert POSIX-shaped paths — flip to blocking once
    # they're platform-aware (tracked in docs/windows.md).
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.6'   # matches .ruby-version; RubyInstaller build
          bundler-cache: true     # exercises the x64-mingw-ucrt lockfile platform

      - name: Install ffmpeg (gyan.dev build — includes drawtext)
        run: choco install ffmpeg -y --no-progress

      - name: Run specs (default suite)
        shell: bash
        run: bundle exec rspec
