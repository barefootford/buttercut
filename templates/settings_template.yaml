# ButterCut User Settings
# Copy this file to libraries/settings.yaml to configure defaults

# Preferred video editor: fcpx, premiere, or resolve
editor: fcpx

# WhisperX model size: tiny, base, small, medium, or turbo
# turbo is nearly as accurate as large-v3 but significantly faster
# Recommended: `small` paired with transcript_refinement (set per-library in library.yaml)
whisper_model: small

# How many footage-processing jobs (transcription, contact sheets) to run in
# parallel per phase. 2 is the safe default — WhisperX is memory-hungry, so
# higher values can exhaust RAM on smaller machines. Leave blank to use 2.
parallel_jobs: 2

# After exporting a roughcut, also drop a copy of the XML on the Desktop for easy import
save_to_desktop_after_export: true

# Open the exported file directly in the editor after export
# open_in_editor_after_export: true

# Where to write library backup archives.
# Defaults to ~/Documents/buttercut-video-editor-backups so backups live outside
# the project directory and survive a fresh clone or `update-buttercut` run.
# Set to a different absolute path (or one starting with ~) to redirect.
# backups_dir: ~/Documents/buttercut-video-editor-backups

# Send error reports to help fix ButterCut? One of:
#   always — send automatically in the background
#   ask    — ask before sending each one
#   never  — never send
# Reports never include your footage, transcripts, contact sheets, or your
# library and clip names — just the error and which step it happened in.
# A missing or blank value means ButterCut hasn't asked yet.
error_reporting:

# Email to attach to those reports, so a ButterCut engineer can follow up
# about your bug. Blank means reports go in without one.
error_report_email:

# Beta features — opt-in flags for features still in testing. Off unless set to
# true here (a missing key or feature reads as off). Uncomment the block and
# name the feature to try it.
# beta_features:
#   feature_name: true
